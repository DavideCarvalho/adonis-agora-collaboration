packages:
  - "packages/*"
# pnpm >= 10 nao roda build script de dependencia sem permissao explicita, e em CI ele
# ERRA (ERR_PNPM_IGNORED_BUILDS) em vez de so avisar -- o release morre no
# `pnpm install --frozen-lockfile` antes de chegar no changesets.
allowBuilds:
  '@biomejs/biome': true
  '@swc/core': true
  esbuild: true
  # testcontainers' transitive deps (dockerode -> ssh2). None of their build scripts are
  # needed: cpu-features is optional native acceleration for ssh2, and protobufjs' postinstall
  # only regenerates code that ships prebuilt.
  cpu-features: false
  protobufjs: false
  ssh2: false
